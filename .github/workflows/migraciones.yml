name: Migraciones (producción)

# Manual. Configura el environment "produccion" con revisores requeridos para que un
# humano apruebe cada ejecución.
on:
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest
    environment: produccion
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # la misma del package.json; sin esto instala una vieja que no lee config.toml
      - run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
      # El CLI 3 apunta a la base local sin --remote, y en la nube solo acepta cambios con --yes.
      - run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
