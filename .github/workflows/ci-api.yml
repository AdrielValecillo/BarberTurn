name: CI API

on:
  pull_request:
    paths: [apps/api/**, supabase/**, packages/**, .github/workflows/ci-api.yml]
  push:
    branches: [main]
    paths: [apps/api/**, supabase/**, packages/**, .github/workflows/ci-api.yml]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run lint-imports
      # Las de integración necesitan Supabase: corren en el job base-de-datos.
      - run: uv run pytest -m "not integracion"
      # Obliga a regenerar los tipos de la web en el mismo cambio (make gen-types).
      - name: openapi.json al día
        run: |
          uv run python -m app.export_openapi ../../packages/api-types/openapi.json
          git diff --exit-code -- ../../packages/api-types/openapi.json

  base-de-datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0 # la misma del package.json; sin esto instala una vieja que no lee config.toml
      # Las pruebas solo usan Postgres (con auth y realtime, que la migración usa): no se bajan las demás imágenes.
      # Un -x por contenedor: el CLI 3 ignora sin avisar la lista separada por comas.
      - run: >-
          supabase start -x studio -x imgproxy -x storage-api -x edge-runtime -x logflare
          -x vector -x mailpit -x postgres-meta -x kong -x postgrest
      - run: supabase test db
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: pruebas de integración de la API
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run pytest -m integracion
