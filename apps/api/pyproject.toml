[project]
name = "turnero-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.2",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Los dominios solo dependen de los que tienen debajo"
type = "layers"
layers = [
  "app.domains.mensajeria",
  "app.domains.notificaciones",
  "app.domains.agenda",
  "app.domains.clientes",
  "app.domains.barberias",
]

[[tool.importlinter.contracts]]
name = "core y shared no conocen los dominios"
type = "forbidden"
source_modules = ["app.core", "app.shared"]
forbidden_modules = ["app.domains"]
